server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: patient-service-manager
  datasource:
    url: ${URL_DB}
    username: ${USERNAME_DB}
    password: ${PASSWORD_DB}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    format-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.hibernate: OFF
    org.hibernate.orm.connections.pooling: OFF