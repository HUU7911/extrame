server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: patient-service-manager
  datasource:
    url: ${URL_DB}
    username: ${USERNAME_DB}
    password: ${PASSWORD_DB}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
        open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect